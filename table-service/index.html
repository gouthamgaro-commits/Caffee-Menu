<title>Olive &amp; Ember Tables</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first guest app (single column, bottom nav) and a wide staff floor grid. */
:root {
  --bg: #f3f4ef; --surface: #ffffff; --surface-2: #e8ebe2; --fg: #17201b; --muted: #59645c; --line: #d6dbcf;
  --accent: #1d6a4c; --accent-fg: #ffffff; --pop: #f2b632; --pop-fg: #2a1d00;
  --alert: #d0402a; --ok: #2b8a57; --cook: #c97a0f; --scrim: rgba(10, 16, 12, .55);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1311; --surface: #181d1a; --surface-2: #222a25; --fg: #edf1ea; --muted: #9ba79e; --line: #2c3530;
  --accent: #4fbf8b; --accent-fg: #06120c; --pop: #f2b632; --pop-fg: #2a1d00;
  --alert: #ff6a50; --ok: #4fbf8b; --cook: #f0a43a; --scrim: rgba(0, 0, 0, .65); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1311; --surface: #181d1a; --surface-2: #222a25; --fg: #edf1ea; --muted: #9ba79e; --line: #2c3530;
  --accent: #4fbf8b; --accent-fg: #06120c; --pop: #f2b632; --pop-fg: #2a1d00;
  --alert: #ff6a50; --ok: #4fbf8b; --cook: #f0a43a; --scrim: rgba(0, 0, 0, .65); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.pop { background: var(--pop); color: var(--pop-fg); }
.btn.alert { background: var(--alert); color: #fff; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.new { background: color-mix(in srgb, var(--pop) 30%, transparent); color: var(--fg); }
.pill.cook { background: color-mix(in srgb, var(--cook) 22%, transparent); color: var(--cook); }
.pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.pill.alert { background: var(--alert); color: #fff; }
.veg { width: 13px; height: 13px; border: 1.5px solid var(--ok); border-radius: 3px; display: inline-grid; place-items: center; flex: none; }
.veg::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
.veg.non { border-color: var(--alert); } .veg.non::after { background: var(--alert); }

/* ---------- Home ---------- */
.home { max-width: 980px; margin: 0 auto; padding-block: 40px 56px; display: grid; gap: 28px; }
.home h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1; font-weight: 800; }
.home .lede { font-size: 18px; max-width: 60ch; color: var(--muted); margin: 14px 0 0; }
.entry { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.entry > section { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 14px; align-content: start; }
.entry h2 { font-size: 22px; }
.tpick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.tpick a { display: grid; place-items: center; aspect-ratio: 1; border-radius: 12px; background: var(--surface-2); color: var(--fg); text-decoration: none; font: 700 18px var(--mono); }
.tpick a:hover { background: var(--accent); color: var(--accent-fg); }
.flow { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin: 0; padding: 0; list-style: none; counter-reset: s; }
.flow li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 14px; color: var(--muted); }
.flow li b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 2px; }
.flow li::before { content: counter(s); font: 700 12px var(--mono); color: var(--accent); }
.modeline { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }

/* ---------- Guest ---------- */
.guest { max-width: 560px; margin: 0 auto; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.ghead { padding-block: 18px 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.ghead h1 { font-size: 26px; font-weight: 800; }
.tableno { display: grid; place-items: center; min-width: 64px; padding: 6px 10px; border-radius: 14px; background: var(--fg); color: var(--bg); line-height: 1.05; text-align: center; }
.tableno small { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.tableno b { font: 700 24px var(--mono); }
.cats { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 10px; background: var(--bg); }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; font-size: 14px; }
.cats button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dishes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-block: 6px; }
.catname { grid-column: 1 / -1; font-size: 20px; margin-top: 12px; scroll-margin-top: 70px; }
.dish { position: relative; display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.dish > button { text-align: left; }
.dish img, .photo { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--surface-2); max-width: 100%; }
.dish .meta { padding: 10px 12px 12px; display: grid; gap: 4px; flex: 1; align-content: start; }
.dish h3 { font-size: 15px; font-weight: 700; line-height: 1.2; }
.dish .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 4px; }
.dish .price { font: 600 14px var(--mono); }
.add { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); color: var(--accent); font-size: 22px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.add.has { background: var(--accent); color: var(--accent-fg); font: 700 15px var(--mono); }
.wifi { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-top: 8px; }
.wifi .k { font-size: 12px; color: var(--muted); }
.wifi .v { font: 600 15px var(--mono); }
.wifi > div { flex: 1; min-width: 0; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; pointer-events: none; }
.dock-in { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock-in > * { pointer-events: auto; }
.basketbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 16px; background: var(--accent); color: var(--accent-fg); font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.callbar { display: flex; gap: 8px; }
.callbar .btn { flex: 1; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.nav button { padding: 9px 4px; border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 2px; position: relative; }
.nav button.on { background: var(--surface-2); color: var(--fg); }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav .badge { position: absolute; top: 4px; right: calc(50% - 26px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--pop); color: var(--pop-fg); font: 700 11px/18px var(--mono); padding: 0 5px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; margin-top: 12px; }
.panel h2 { font-size: 19px; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; }
.lines li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.lines li:first-child { border-top: 0; }
.lines .q { font: 700 14px var(--mono); min-width: 28px; }
.lines .n { flex: 1; min-width: 0; }
.lines .n small { display: block; color: var(--muted); font-size: 12px; }
.lines .p { font: 500 14px var(--mono); }
.lines img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; }
.sum { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.sum div { display: flex; justify-content: space-between; }
.sum span:last-child { font-family: var(--mono); }
.sum .tot { color: var(--fg); font-weight: 700; font-size: 18px; padding-top: 6px; }
.namefield { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.namefield input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; color: var(--fg); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.copy { flex: none; }

/* Game */
.game { display: grid; gap: 12px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.modes button { padding: 8px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
.modes button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px; border-radius: 20px; background: #3b2a1c; }
.basket { position: relative; aspect-ratio: 1; border-radius: 50%; background: repeating-radial-gradient(circle, #c99a5c 0 6px, #b48447 6px 9px); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25), inset 0 0 0 6px #9c6d34; display: grid; place-items: center; overflow: hidden; }
.basket i { width: 64%; aspect-ratio: 1.15; border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; background: radial-gradient(circle at 40% 30%, #fffdf6, #efe6d2 60%, #d9ccb0); box-shadow: 0 4px 0 rgba(0,0,0,.18); transform: scale(0); transition: transform .12s; position: relative; }
.basket i::before { content: ""; position: absolute; left: 50%; top: 4%; width: 34%; height: 30%; transform: translateX(-50%); border-radius: 50%; background: repeating-conic-gradient(from 200deg, #d6c9ab 0 8deg, transparent 8deg 24deg); }
.basket.up i { transform: scale(1); }
.basket.chili i { background: radial-gradient(circle at 40% 30%, #ff7a5c, #d7261b 60%, #9e1610); border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; aspect-ratio: .7; }
.basket.chili i::before { background: #2f8f3a; border-radius: 40% 40% 10% 10%; width: 30%; height: 18%; top: -6%; }
.basket.hit i { transform: scale(1.25); opacity: 0; transition: transform .15s, opacity .15s; }
.hud { display: flex; justify-content: space-between; align-items: center; font: 700 22px var(--mono); }
.hud small { font: 500 12px var(--body); color: var(--muted); display: block; }
.board-wrap { position: relative; }
.board-cover { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: color-mix(in srgb, #1b120a 72%, transparent); border-radius: 20px; color: #fff4e2; padding: 20px; }
.board-cover h3 { font-size: 26px; }
.board-cover p { margin: 6px 0 14px; opacity: .85; }
.lb { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.lb li { counter-increment: r; display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.lb li:first-child { border-top: 0; }
.lb li::before { content: counter(r); font: 700 13px var(--mono); color: var(--muted); width: 22px; }
.lb li.me { font-weight: 700; }
.lb li.me::before { color: var(--accent); }
.lb .s { margin-left: auto; font: 700 15px var(--mono); }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s both; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; animation: up .28s cubic-bezier(.2, .8, .2, 1) both; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 24px; } }
.sheet-b { padding: 18px 20px 20px; display: grid; gap: 14px; }
.sheet .photo { border-radius: 24px 24px 0 0; aspect-ratio: 16 / 10; }
.sheet h2 { font-size: 24px; }
.xrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); font-size: 20px; flex: none; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; }
.stepper button { width: 40px; height: 42px; font-size: 20px; color: var(--accent); }
.stepper span { min-width: 24px; text-align: center; font: 700 15px var(--mono); }
.stepper.sm button { width: 32px; height: 34px; font-size: 17px; }
.tips, .methods { display: grid; gap: 8px; }
.tips { grid-template-columns: repeat(4, 1fr); }
.tips button { padding: 10px 4px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.tips button.on { border-color: var(--accent); color: var(--accent); }
.methods .btn { min-height: 52px; }
.pay-apple { background: #000 !important; color: #fff !important; }
.pay-google { background: var(--surface) !important; color: var(--fg) !important; border: 1.5px solid var(--line); }
.note { font-size: 12px; color: var(--muted); text-align: center; }
.bigcheck { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 36px; margin: 8px auto 0; }
@keyframes fade { from { opacity: 0 } }
@keyframes up { from { transform: translateY(40px); opacity: 0 } }

/* ---------- Staff ---------- */
.staff { min-height: 100%; }
.shead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--fg); color: var(--bg); }
.shead-in { max-width: 1280px; margin: 0 auto; padding-block: 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.shead h1 { font-size: 20px; margin-right: auto; }
.stabs { display: flex; gap: 4px; background: color-mix(in srgb, var(--bg) 14%, transparent); padding: 4px; border-radius: 12px; }
.stabs button { padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 14px; opacity: .75; }
.stabs button.on { background: var(--bg); color: var(--fg); opacity: 1; }
.sbody { max-width: 1280px; margin: 0 auto; padding-block: 18px 40px; display: grid; gap: 18px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.kpi .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi .v { font: 700 26px var(--mono); }
.kpi.hot .v { color: var(--alert); }
.floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.tcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; min-height: 150px; align-content: start; position: relative; border-top: 5px solid var(--line); }
.tcard.s-call { border-top-color: var(--alert); animation: ring 1.4s infinite; }
.tcard.s-bill { border-top-color: var(--pop); }
.tcard.s-new { border-top-color: var(--pop); }
.tcard.s-cooking { border-top-color: var(--cook); }
.tcard.s-seated { border-top-color: var(--ok); }
.tcard.s-paid { border-top-color: var(--accent); }
.tcard.s-empty { opacity: 1; }
@keyframes ring { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--alert) 35%, transparent); } }
.tcard .top { display: flex; justify-content: space-between; align-items: baseline; }
.tcard .num { font: 700 28px var(--mono); }
.tcard .state { font-size: 13px; font-weight: 600; }
.tcard .pills { display: flex; flex-wrap: wrap; gap: 6px; }
.tcard .foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: auto; }
.tcard .foot b { color: var(--fg); font-family: var(--mono); }
.legend { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 4px; border-radius: 2px; display: inline-block; }
.tickets { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: start; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
.ticket h3 { font: 700 20px var(--mono); display: flex; justify-content: space-between; align-items: baseline; }
.ticket h3 small { font: 500 13px var(--body); color: var(--muted); }
.sec-h { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 4px 0 -4px; }
.alertbox { background: color-mix(in srgb, var(--alert) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--alert) 40%, transparent); border-radius: 12px; padding: 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.alertbox.bill { background: color-mix(in srgb, var(--pop) 18%, var(--surface)); border-color: color-mix(in srgb, var(--pop) 60%, transparent); }
.alertbox.paid { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.photos .item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.photos .item div { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.photos label { cursor: pointer; }
.photos input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); animation: up .2s both; }
.scrim.still, .scrim.still .sheet { animation: none; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .dishes { gap: 8px; } .tpick { grid-template-columns: repeat(4, 1fr); } }

/* ===== v2 refinements ===== */
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.home-hero { display: grid; gap: 24px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: center; }
.home-hero .eyebrow { margin-bottom: 10px; }
.shots { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 64px; gap: 8px; }
.shots img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
.shots img:nth-child(1) { grid-column: 1 / 5; grid-row: 1 / 4; }
.shots img:nth-child(2) { grid-column: 5 / 7; grid-row: 1 / 3; }
.shots img:nth-child(3) { grid-column: 5 / 7; grid-row: 3 / 5; }
.shots img:nth-child(4) { grid-column: 1 / 3; grid-row: 4 / 6; }

.shots.small { grid-template-columns: 2fr 1fr; grid-auto-rows: 52px; margin-bottom: 16px; }

.ghead { padding-block: 16px 6px; align-items: center; }
.ghead h1 { font-size: 30px; line-height: 1.05; }
.ghead h1 .mono { font-size: .95em; }
.bell { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; flex: none; }
.bell svg, .wifi > svg, .howto svg, .soundbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.bell span { display: grid; text-align: left; line-height: 1.1; }
.bell small { font-size: 11px; font-weight: 500; opacity: .85; }
.bell.on { background: var(--alert); border-color: var(--alert); color: #fff; animation: ring 1.6s infinite; }
.bell.on svg { animation: wiggle 1.6s infinite; transform-origin: 50% 20%; }
@keyframes wiggle { 0%, 60%, 100% { transform: rotate(0); } 10%, 30%, 50% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-14deg); } }

.status { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 14px; border-radius: 14px; margin-top: 8px; font-size: 14px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); }
.status .st-t { flex: 1; min-width: 0; }
.status .st-l { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.status .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.status.new { background: color-mix(in srgb, var(--pop) 16%, var(--surface)); border-color: color-mix(in srgb, var(--pop) 55%, transparent); }
.status.new .pulse { background: var(--pop); animation: pulse 1.4s infinite; }
.status.cook { background: color-mix(in srgb, var(--cook) 12%, var(--surface)); border-color: color-mix(in srgb, var(--cook) 45%, transparent); }
.status.cook .pulse { background: var(--cook); animation: pulse 1.4s infinite; }
.status.ok .pulse { background: var(--ok); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, currentColor 0%, transparent); opacity: .45; } }

.tools { display: flex; gap: 8px; margin-top: 12px; }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 46px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.search svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--fg); }
.search:focus-within { border-color: var(--accent); }
.vegchip { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; height: 46px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.vegchip.on { border-color: var(--ok); color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }

.sec { font-size: 20px; margin: 18px 0 10px; }
.carousel { display: grid; grid-auto-flow: column; grid-auto-columns: 74%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; margin-inline: -4px; padding-inline: 4px; }
.carousel::-webkit-scrollbar { display: none; }
.pcard { position: relative; scroll-snap-align: start; border-radius: 18px; overflow: hidden; text-align: left; color: #fff; background: #222; }
.pcard img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; max-width: 100%; }
.pc-b { position: absolute; inset: auto 0 0 0; padding: 30px 14px 12px; background: linear-gradient(transparent, rgba(0, 0, 0, .78)); display: grid; gap: 2px; }
.pc-n { font: 700 17px/1.2 var(--display); }
.pc-m { font-size: 12.5px; opacity: .9; }

.dishes .catname { margin-top: 18px; }
.dish-open { display: flex; flex-direction: column; width: 100%; height: 100%; text-align: left; }
.dish .meta { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; flex: 1; }
.dish .h3 { font: 700 15px/1.2 var(--display); }
.dish .d { font-size: 12.5px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dish .row { margin-top: auto; padding-top: 6px; }
.tag { align-self: flex-start; display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--pop) 28%, transparent); color: var(--fg); }
.add.bump, .basketbar.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.18); } }
.emptybox { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 28px 12px; color: var(--muted); font-size: 14px; }
.emptybox b { color: var(--fg); font-size: 16px; }
.emptybox .btn { margin-top: 6px; }
.wifi.slim { margin-top: 20px; }
.wifi > svg { color: var(--accent); }

.basketbar { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; text-align: left; }
.bb-c { min-width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent-fg) 20%, transparent); font-size: 14px; }

.tracker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tracker div { display: grid; gap: 2px; padding: 10px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: 12px; position: relative; }
.tracker b { font-size: 20px; color: var(--muted); }
.tracker .on b { color: var(--fg); }
.tracker .on.new { background: color-mix(in srgb, var(--pop) 22%, var(--surface)); color: var(--fg); }
.tracker .on.cook { background: color-mix(in srgb, var(--cook) 16%, var(--surface)); color: var(--fg); }
.tracker .on.ok { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--fg); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.unsent { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }

.field { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
.field input { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 400; color: var(--fg); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.photo-wrap { position: relative; }
.x.float { position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, .5); color: #fff; }
.dmeta { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.dmeta .mono { font-size: 18px; font-weight: 700; color: var(--fg); margin-right: 6px; }
.sheet .tag { margin-bottom: 6px; }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.pair { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.pair img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }
.pair > span { flex: 1; min-width: 0; display: grid; font-size: 13px; }
.pair b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pair i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-weight: 700; flex: none; }
.addrow { display: flex; gap: 12px; align-items: center; position: sticky; bottom: 0; background: var(--bg); padding-block: 8px 4px; }

.welcome-top { padding: 20px 20px 18px; background: var(--fg); color: var(--bg); border-radius: 24px 24px 0 0; }
.welcome-top .eyebrow { color: inherit; opacity: .7; }
.welcome-top h2 { font-size: 28px; margin-top: 2px; }
.howto { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: 14px; color: var(--muted); }
.howto li { display: flex; gap: 12px; align-items: flex-start; }
.howto svg { color: var(--accent); margin-top: 1px; }
.howto b { color: var(--fg); font-weight: 600; }

.modes button:disabled { opacity: .45; cursor: default; }
.splitrow { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.bigcheck svg { width: 38px; height: 38px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.req { color: var(--cook); font-weight: 600; }

/* game */
.tbar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--alert), var(--pop)); border-radius: 4px; }
.count { font: 800 88px/1 var(--display); color: #fff4e2; animation: pop .6s both; }
@keyframes pop { from { transform: scale(1.6); opacity: 0; } }
.plus { position: absolute; font: 800 22px var(--display); color: #fff4e2; text-shadow: 0 2px 6px rgba(0, 0, 0, .5); animation: rise .45s both; pointer-events: none; }
.plus.minus { color: #ffb3a6; }
@keyframes rise { to { transform: translateY(-28px); opacity: 0; } }
.basket { touch-action: manipulation; }

/* staff */
.shead h1 { margin-right: auto; }
.sbadge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--alert); color: #fff; font: 700 11px var(--mono); margin-left: 4px; }
.sbadge.k { background: var(--cook); }
.soundbtn { gap: 6px; }
.soundbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.kpi .of { font-size: 16px; color: var(--muted); }
.kpi-s { font-size: 12px; color: var(--ok); font-weight: 600; margin-top: 2px; }
.floorwrap { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .floorwrap { grid-template-columns: 1fr; } }
.queue { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
@media (max-width: 900px) { .queue { position: static; } }
.queue h2 { font-size: 18px; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.queue ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.queue li { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--bg); border-left: 4px solid var(--line); }
.queue li.q-alert { border-left-color: var(--alert); }
.queue li.q-new, .queue li.q-bill { border-left-color: var(--pop); }
.qt { font-size: 18px; font-weight: 700; }
.qx { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; }
.qx small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.allclear { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 24px 12px; color: var(--muted); font-size: 14px; }
.allclear svg { width: 34px; height: 34px; fill: none; stroke: var(--ok); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; padding: 6px; border-radius: 50%; background: color-mix(in srgb, var(--ok) 14%, transparent); box-sizing: content-box; }
.allclear b { color: var(--fg); font-size: 16px; }
.floor { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.tcard { cursor: pointer; min-height: 140px; }
.tcard:hover { border-color: color-mix(in srgb, var(--fg) 25%, var(--line)); }
.tcard .qa { justify-self: start; }
.ticket { border-top: 5px solid var(--cook); }
.ticket .age { font: 600 13px var(--mono); padding: 2px 8px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.ticket.late { border-top-color: var(--pop); }
.ticket.late .age { background: color-mix(in srgb, var(--pop) 30%, transparent); color: var(--fg); }
.ticket.late2 { border-top-color: var(--alert); }
.ticket.late2 .age { background: var(--alert); color: #fff; }

/* ===== admin ===== */
.entry { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.intro { gap: 14px; }
.linkline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
.linkline .k { font-weight: 600; color: var(--muted); }
.linkline code { flex: 1; min-width: 0; font: 500 13px var(--mono); overflow-wrap: anywhere; }
.linkbox { display: block; padding: 12px; border-radius: 10px; background: var(--surface-2); font: 500 13px var(--mono); overflow-wrap: anywhere; user-select: all; }
.tents { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.tent { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.tent img { width: 100%; aspect-ratio: 600 / 820; border-radius: 10px; border: 1px solid var(--line); background: #fbfaf6; }
.tent-a { display: flex; gap: 6px; flex-wrap: wrap; }
.tent-a .btn { flex: 1; padding: 0 8px; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; }
.mlist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.mlist li:first-child { border-top: 0; }
.mlist img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; }
.mlist .n { flex: 1; min-width: 140px; }
.mlist .n b { display: block; font-weight: 600; }
.mlist .n small { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.mlist li.off img { filter: grayscale(1); opacity: .55; }
.mlist li.off .n b { color: var(--muted); text-decoration: line-through; }
.avail { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--alert) 12%, var(--surface)); color: var(--alert); border: 1px solid color-mix(in srgb, var(--alert) 35%, transparent); }
.avail i { width: 28px; height: 16px; border-radius: 8px; background: currentColor; opacity: .35; position: relative; }
.avail i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); }
.avail.on { background: color-mix(in srgb, var(--ok) 12%, var(--surface)); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.avail.on i { opacity: 1; }
.avail.on i::after { left: 14px; }
.form { gap: 16px; max-width: 760px; }
.form h2 { font-size: 17px; margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.field select { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: inherit; font-size: 16px; font-weight: 400; color: var(--fg); }
.field input, .field select { width: 100%; min-width: 0; }
.formerr { margin: 0; color: var(--alert); font-weight: 600; font-size: 14px; }
.photo.rounded { border-radius: 14px; aspect-ratio: 16 / 9; }
.photoctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.photoctl label { cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.dish.soldout img { filter: grayscale(1); opacity: .6; }
.dish.soldout .h3 { color: var(--muted); }
.sold { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 700; }

/* ===== v4: layout fix, offers, payments, orders, sales ===== */
.sheet { overflow-x: hidden; overscroll-behavior: contain; min-width: 0; }
.sheet-b, .panel, .entry > section, .game, .home, .sbody, .tent, .ticket, .intro { grid-template-columns: minmax(0, 1fr); }
.sheet-b > *, .panel > * { min-width: 0; }
.pair { min-width: 0; }
.stabs { overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.stabs button { white-space: nowrap; }
.offers .sec { margin-top: 16px; }
.offer-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 80%); gap: 10px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
.offer-row::-webkit-scrollbar { display: none; }
.offer { scroll-snap-align: start; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--pop) 18%, var(--surface)); border: 1px dashed color-mix(in srgb, var(--pop) 70%, transparent); }
.offer svg, .offerline svg, .coupon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; flex: none; }
.offer b { display: block; font-size: 14px; }
.offer small { color: var(--muted); font-size: 12px; }
.deal { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 6px; background: var(--pop); color: var(--pop-fg); font: 700 11px var(--body); vertical-align: 1px; }
.offerline { color: var(--ok) !important; font-weight: 600; }
.offerline span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.offerline.big { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 12%, var(--surface)); font-size: 14px; }

.coupon { display: flex; gap: 8px; align-items: center; }
.coupon input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; color: var(--fg); text-transform: uppercase; }

.reasons { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.reason { padding: 16px 12px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 600; text-align: left; }
.reason:hover, .reason:focus-visible { border-color: var(--accent); }
.pay-upi { background: var(--accent) !important; color: var(--accent-fg) !important; }
.upibox { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.upibox > div { flex: 1; min-width: 0; }
.upibox .k { font-size: 12px; color: var(--muted); }
.upibox .v { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.bigcheck.wait { background: var(--pop); }
.bigcheck.wait svg { width: 36px; height: 36px; fill: none; stroke: var(--pop-fg); stroke-width: 2; }
.tcard.s-confirm { border-top-color: var(--pop); }
.queue li.q-pay { border-left-color: var(--pop); flex-wrap: wrap; }
.qb { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.queue li.q-pay .qb { width: 100%; }
.sbadge.n { background: var(--pop); color: var(--pop-fg); }
.ofil { max-width: 560px; grid-template-columns: repeat(4, 1fr); }
.ofil .mono { font-size: 11px; opacity: .7; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.feed li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); flex-wrap: wrap; }
.feed li.f-new { border-left: 4px solid var(--pop); }
.feed li.f-cooking { border-left: 4px solid var(--cook); }

.feed .ft, .bills .ft { font-size: 12px; color: var(--muted); min-width: 64px; }
.feed .qt { font-size: 15px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: var(--surface-2); }
.feed .qx { flex: 1; min-width: 160px; font-size: 14px; }
.feed .qx small { display: block; color: var(--muted); font-size: 12px; }
.srange { grid-template-columns: repeat(4, auto); }
.salesgrid { align-items: start; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.bars li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.bars li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.datanote p { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.csvbox { width: 100%; font: 12px var(--mono); padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.otag { min-width: 56px; text-align: center; padding: 8px 6px; border-radius: 10px; background: color-mix(in srgb, var(--pop) 25%, transparent); font-weight: 700; }
.allclear.locked svg { stroke: var(--muted); background: var(--surface-2); }
code { font-family: var(--mono); font-size: .92em; }

/* ===== v7: wait times, allergens, order again, ratings, swipe ===== */
.sheet::before { display: none; }
.grab { position: absolute; top: 0; left: 28%; right: 28%; height: 34px; z-index: 4; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grab i { width: 46px; height: 5px; border-radius: 3px; background: color-mix(in srgb, #15112b 35%, transparent); }
.sheet { position: relative; }
.dmeta .eta { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg); font-weight: 600; }
.dmeta .eta svg, .alg svg, .algbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.alg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.alg span { padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--cook) 16%, var(--surface)); color: var(--fg); font-weight: 600; font-size: 12px; }
.algbtn { padding: 0 12px; gap: 4px; }
.algbtn.on { background: #ffd0e0; color: #15112b; border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.algbar { margin-top: 10px; padding: 12px; border-radius: 18px; background: var(--surface); box-shadow: var(--lift); display: grid; gap: 8px; }
.algchips { display: flex; flex-wrap: wrap; gap: 6px; }
.algchip { padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.algchip.on { background: #ffd0e0; color: #15112b; border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); text-decoration: none; }
.again { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.again::-webkit-scrollbar { display: none; }
.again-chip { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: 13px; max-width: 220px; }
.again-chip img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
.again-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.again-chip b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--pop); color: var(--pop-fg); border: 1.5px solid var(--ink); flex: none; }
.rate { display: grid; gap: 10px; justify-items: center; padding: 14px; border-radius: 20px; background: linear-gradient(120deg, #fff1c2, #ffd6ea); color: #15112b; border: 1.5px solid #15112b; box-shadow: 3px 3px 0 #15112b; }
.rate.done { gap: 2px; } .rate.done .muted { color: #4a4460; }
.stars { display: flex; gap: 4px; }
.star { font-size: 34px; line-height: 1; color: rgba(21, 17, 43, .22); padding: 2px; transition: transform .15s cubic-bezier(.3, 1.8, .5, 1), color .15s; }
.star.on { color: #ff9f1a; text-shadow: 1px 1px 0 #15112b; transform: scale(1.08); }
.star:active { transform: scale(.9); }
.rate textarea { width: 100%; padding: 10px 12px; border-radius: 14px; border: 1.5px solid #15112b; font: inherit; font-size: 16px; resize: none; background: #fff; color: #15112b; }
.late-t { color: var(--alert); }
.algset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.algset legend { font-size: 14px; font-weight: 600; margin-bottom: 6px; padding: 0; }

.avgstar { font-size: 14px; color: var(--muted); } .avgstar b { font-family: var(--display); font-size: 22px; color: var(--fg); }
.fb { margin: 0; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); font-size: 14px; display: grid; gap: 2px; }
.fb-s { color: #ff9f1a; letter-spacing: 1px; font-size: 13px; }
.fb small { color: var(--muted); font-size: 12px; }

/* ===== v8: staff and admin on phones ===== */
@media (max-width: 640px) {
  .shead-in { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; align-items: center; gap: 8px; padding-block: 10px; }
  .shead h1 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shead .stabs { grid-column: 1 / -1; grid-row: 2; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .shead .stabs button { padding: 8px 6px; font-size: 13px; }
  .shead .btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
  .soundbtn .lbl { display: none; }

  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

}
.mlist .n small { flex-wrap: wrap; }
.btn { white-space: nowrap; }

/* ===== v9: dish choices ===== */
.optg { display: grid; gap: 8px; }
.opt-hint { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
.optchips { display: flex; flex-wrap: wrap; gap: 8px; }
.optchip { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; transition: transform .15s cubic-bezier(.3, 1.8, .5, 1); }
.optchip b { color: var(--muted); font-weight: 600; font-size: 13px; }
.optchip.on { background: linear-gradient(120deg, #e9fbb0, #c9f7d6); color: #15112b; border-color: #15112b; box-shadow: 2px 2px 0 #15112b; transform: translateY(-1px); }
.optchip.on b { color: #3d3a52; }
.spicy .optchip.on { background: linear-gradient(120deg, #ffe0bf, #ffb3a0); }
.chili { display: inline-flex; gap: 2px; }
.chili b { width: 6px; height: 13px; border-radius: 6px 6px 6px 2px; background: linear-gradient(180deg, #2f9e44 0 22%, #ff3b30 22%); transform: rotate(18deg); box-shadow: inset -1px -1px 0 rgba(0,0,0,.18); }
.optt { color: var(--accent); font-weight: 700; }

/* ===== v10: accessibility ===== */
.tcard .top { display: flex; justify-content: space-between; align-items: baseline; width: 100%; text-align: left; gap: 8px; }
.cover-h { font-size: 26px; color: #d4f53c; }
.offer-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 18px; }

:root { --alert-fg: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --alert-fg: #15112b; } }
:root[data-theme="dark"] { --alert-fg: #15112b; }
.btn.alert, .pill.alert { color: var(--alert-fg); }
.bell.on { background: #d6175a; }
.catname small { color: color-mix(in srgb, var(--fg) 82%, transparent); }

/* ===== v11: named waiters ===== */
.who { gap: 6px; }
.avatar { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--pop); color: var(--pop-fg); font: 800 12px var(--display); }
@media (max-width: 640px) { .who .lbl { display: none; } }

/* ===== v12: Clean & appetizing theme ===== */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f4f4f6; --fg: #1c1c1e; --muted: #686b73; --line: #ececef;
  --accent: #d63b2f; --accent-2: #e8532c; --accent-fg: #ffffff; --accent-soft: #fdecea;
  --pop: #ffb703; --pop-fg: #1c1c1e; --alert: #c8143f; --alert-fg: #ffffff; --ok: #13845a; --cook: #c96a00;
  --scrim: rgba(18, 18, 20, .5); --ink: #1c1c1e; --glass: rgba(255, 255, 255, .92);
  --display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Plus Jakarta Sans", system-ui, sans-serif;
  --r: 16px; --lift: 0 1px 2px rgba(20, 20, 30, .06), 0 6px 18px -8px rgba(20, 20, 30, .16);
  --t-starters: linear-gradient(160deg, #f3fbf5, #e2f4e7); --t-mains: linear-gradient(160deg, #fff7f0, #ffe8d9);
  --t-desserts: linear-gradient(160deg, #fff5f7, #fde3ea); --t-drinks: linear-gradient(160deg, #f2f7ff, #e1ebff);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121214; --surface: #1c1c1f; --surface-2: #26262a; --fg: #f3f3f5; --muted: #a3a3ab; --line: #2e2e33;
  --accent: #ff6b5e; --accent-2: #ff8a5b; --accent-fg: #1a0a08; --accent-soft: #3a1f1c;
  --pop: #ffc233; --pop-fg: #1c1c1e; --alert: #ff6b93; --alert-fg: #1c1c1e; --ok: #4cd48f; --cook: #ffa24a;
  --scrim: rgba(0, 0, 0, .6); --ink: #000000; --glass: rgba(28, 28, 31, .92); --lift: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px -10px rgba(0, 0, 0, .7);
  --t-starters: linear-gradient(160deg, #1f2a23, #18221c); --t-mains: linear-gradient(160deg, #2d231d, #241b16);
  --t-desserts: linear-gradient(160deg, #2c2025, #23191e); --t-drinks: linear-gradient(160deg, #1e2430, #181d27); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121214; --surface: #1c1c1f; --surface-2: #26262a; --fg: #f3f3f5; --muted: #a3a3ab; --line: #2e2e33;
  --accent: #ff6b5e; --accent-2: #ff8a5b; --accent-fg: #1a0a08; --accent-soft: #3a1f1c;
  --pop: #ffc233; --pop-fg: #1c1c1e; --alert: #ff6b93; --alert-fg: #1c1c1e; --ok: #4cd48f; --cook: #ffa24a;
  --scrim: rgba(0, 0, 0, .6); --ink: #000000; --glass: rgba(28, 28, 31, .92); --lift: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px -10px rgba(0, 0, 0, .7);
  --t-starters: linear-gradient(160deg, #1f2a23, #18221c); --t-mains: linear-gradient(160deg, #2d231d, #241b16);
  --t-desserts: linear-gradient(160deg, #2c2025, #23191e); --t-drinks: linear-gradient(160deg, #1e2430, #181d27); color-scheme: dark; }
body { font-family: var(--body); font-variant-numeric: tabular-nums; }
h1, h2, h3, .h3, .pc-n { font-family: var(--display); letter-spacing: -.015em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.c-starters { --cat: #2f9e5f; --catg: var(--t-starters); } .c-mains { --cat: #d9622b; --catg: var(--t-mains); }
.c-desserts { --cat: #c8467a; --catg: var(--t-desserts); } .c-drinks { --cat: #3a6ad6; --catg: var(--t-drinks); }

/* buttons: solid, simple */
.btn { border-radius: 12px; font-weight: 700; white-space: nowrap; transition: transform .12s, background-color .15s, box-shadow .15s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:not(.ghost):not(.pop):not(.alert):not(.pay-google):not(.pay-apple) { background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--accent) 60%, transparent); }
.btn.pop { background: var(--pop); color: var(--pop-fg); box-shadow: none; }
.btn.alert { background: var(--alert); color: var(--alert-fg); box-shadow: none; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }

/* small badges */
.tag { display: inline-block; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #fff4d6; color: #8a5a00; border: 0; box-shadow: none; transform: none; }
.deal { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 5px; background: #e7f6ee; color: #0f7a4d; font: 800 10.5px var(--body); transform: none; border: 0; box-shadow: none; }
.pill.new { background: #fff4d6; color: #7a5200; } .pill.cook { background: #ffeedd; color: #9a4d00; } .pill.ok { background: #e7f6ee; color: #0f7a4d; }

/* guest header */
.guest { position: relative; }
.ghead { margin: 0; padding: 14px 0 10px; border-radius: 0; background: none; box-shadow: none; color: var(--fg); align-items: center; gap: 12px; border-bottom: 1px solid var(--line); flex-wrap: nowrap; }
.ghead::after { display: none; }
.ghead .eyebrow { color: var(--muted); opacity: 1; letter-spacing: .06em; font-size: 11px; }
.ghead h1 { font-size: 24px; font-weight: 800; line-height: 1.1; margin-top: 2px; white-space: nowrap; }
.ghead h1 .mono { font-family: var(--display); font-size: 1em; color: var(--accent); }
.bell { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); box-shadow: none; min-height: 42px; padding: 0 14px 0 10px; font-weight: 700; }
.bell:active { transform: scale(.97); box-shadow: none; }
.bell.on { background: var(--alert); border-color: var(--alert); color: var(--alert-fg); animation: none; }
.bell small { opacity: .9; }

.status { margin-top: 12px; border-radius: 12px; border: 1px solid var(--line); box-shadow: none; color: var(--fg); background: var(--surface-2); font-weight: 600; }
.status.new { background: #fff7e0; border-color: #ffe3a3; color: #5c3d00; }
.status.cook { background: #fff1e6; border-color: #ffd5b3; color: #6b3500; }
.status.ok { background: #eaf7f0; border-color: #bfe8d2; color: #0b5e3a; }
.status .st-l { color: inherit; opacity: .8; }
.status .pulse { box-shadow: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .status.new, :root:not([data-theme="light"]) .status.cook, :root:not([data-theme="light"]) .status.ok { background: var(--surface-2); border-color: var(--line); color: var(--fg); } }
:root[data-theme="dark"] .status.new, :root[data-theme="dark"] .status.cook, :root[data-theme="dark"] .status.ok { background: var(--surface-2); border-color: var(--line); color: var(--fg); }

.tools { margin-top: 12px; }
.search, .vegchip { border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); height: 44px; }
.search:focus-within { border-color: var(--accent); background: var(--surface); }
.vegchip { background: var(--surface); }
.vegchip.on { background: #e7f6ee; color: #0f7a4d; border-color: #9fd8b9; box-shadow: none; }
.algbtn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); box-shadow: none; }
.sec { font-size: 18px; font-weight: 800; margin: 20px 0 10px; }

/* offers */
.offer { border: 1px dashed #f0b9b3; border-radius: 14px; background: var(--accent-soft); color: var(--fg); box-shadow: none; }
.offer svg { color: var(--accent); }
.offer small { color: var(--muted); }

/* popular carousel */
.carousel { grid-auto-columns: 64%; padding-block: 2px 6px; }
.pcard { border-radius: 16px; background: var(--surface); color: var(--fg); box-shadow: var(--lift); overflow: hidden; border: 1px solid var(--line); }
.pcard .tile { border-radius: 0; aspect-ratio: 4 / 3; box-shadow: none; }
.pcard img.tile { animation: none; }
.pc-b { position: static; background: none; padding: 10px 12px 12px; display: grid; gap: 2px; }
.pc-n { font-size: 15px; font-weight: 700; }
.pc-m { color: var(--muted); font-size: 12.5px; }

/* category tabs */
.cats { background: var(--bg); padding-block: 10px; }
.cats::before { display: none; }
.cats button { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: none; }
.cats button .dot { display: none; }
.cats button.on, :root[data-theme="dark"] .cats button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); box-shadow: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cats button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); } }
.catname { font-size: 20px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
.catname::before { display: none; }
.catname small { font: 600 13px var(--body); color: var(--muted); }

/* dish cards */
.dishes { gap: 12px; }
.dish { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--lift); overflow: hidden; transition: transform .2s; transform-style: flat; }
.dish:active { transform: scale(.99); }
.dish-open { border-radius: 0; overflow: hidden; }
.dish .tile { margin: 0; width: 100%; border-radius: 0; }
.dish .meta { padding: 10px 12px 12px; gap: 3px; }
.dish .h3 { font-size: 14px; font-weight: 700; line-height: 1.25; }
.dish .d { font-size: 12px; }
.dish .price { font-size: 15px; font-weight: 800; }
.dish .row { min-height: 34px; padding-right: 70px; padding-top: 6px; }
.dish .tag { position: absolute; top: 8px; left: 8px; z-index: 2; }
.add { position: absolute; top: auto; bottom: 12px; right: 10px; width: auto; min-width: 62px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--surface); color: var(--accent); border: 1px solid var(--accent); box-shadow: 0 2px 6px -2px color-mix(in srgb, var(--accent) 50%, transparent); font: 800 13px var(--body); letter-spacing: .03em; }
.add.has { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.add:active { transform: scale(.95); box-shadow: none; }
.sold { position: absolute; top: auto; bottom: 14px; right: 10px; padding: 5px 9px; border-radius: 8px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); font-size: 12px; font-weight: 700; transform: none; }
.dish.soldout img { filter: grayscale(1); opacity: .55; }

/* 3D / photo tiles */
.tile { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; max-width: 100%; --tc: var(--t-mains); background: var(--tc); }
.tile.c-starters { --tc: var(--t-starters); } .tile.c-mains { --tc: var(--t-mains); } .tile.c-desserts { --tc: var(--t-desserts); } .tile.c-drinks { --tc: var(--t-drinks); }
img.tile[src^="data:image/gif"] { background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%) 150% 0 / 250% 100% no-repeat, var(--tc); animation: sheen 1.3s linear infinite; }
@keyframes sheen { to { background-position: -50% 0, 0 0; } }
.lines img, .pair img, .mlist img, .again-chip img { background: var(--t-mains); object-fit: cover; }

/* bottom dock */
.nav { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 24px -10px rgba(20, 20, 30, .25); }
.nav button { color: var(--muted); }
.nav button.on { background: var(--accent-soft); color: var(--accent); }
.nav .badge { background: var(--accent); color: var(--accent-fg); border: 2px solid var(--surface); }
.basketbar { border-radius: 14px; background: var(--accent); color: var(--accent-fg); border: 0; box-shadow: 0 8px 22px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
.bb-c { background: rgba(255, 255, 255, .22); color: inherit; border: 0; border-radius: 8px; }
.basketbar.bump { animation: bump .35s; }

/* panels and sheets */
.panel { border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--lift); }
.unsent { border: 1.5px dashed var(--accent); }
.sheet { border-radius: 20px 20px 0 0; }
@media (min-width: 720px) { .sheet { border-radius: 20px; } }
.sheet .photo { border-radius: 20px 20px 0 0; }
.viewer { position: relative; width: 100%; aspect-ratio: 3 / 2; border-radius: 20px 20px 0 0; overflow: hidden; cursor: grab; touch-action: pan-y; }
.viewer:active { cursor: grabbing; }
.viewer-canvas { display: block; width: 100%; height: 100%; }
.spin-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 2; pointer-events: none; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(28, 28, 30, .72); color: #fff; border: 0; box-shadow: none; animation: none; }
.photo-wrap { position: relative; }
.photo-wrap .x.float { z-index: 3; background: rgba(255, 255, 255, .95); color: #1c1c1e; border: 0; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
.grab i { background: rgba(28, 28, 30, .28); }
.pair { border-radius: 12px; } .pair i { background: var(--accent); color: var(--accent-fg); border: 0; }
.reason { border-radius: 12px; border: 1px solid var(--line); }
.reason:hover, .reason:focus-visible { border-color: var(--accent); color: var(--accent); }
.tips button { border-radius: 10px; border: 1px solid var(--line); }
.tips button.on, .modes button.on { box-shadow: none; }
.tips button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.bigcheck { box-shadow: none; border: 0; }
.optchip { border-radius: 10px; border: 1px solid var(--line); }

const game = { running: false, counting: false, score: 0, left: 20, timers: [], last: LS.get("rt-last", 0), best: LS.get("rt-best", 0), newBest: false };
function guestPlay() {
  const scores = Object.entries(S.scores).map(([id, s]) => ({ id, ...s }));

  const cover = game.last ? `<h2 class="cover-h">${game.newBest ? "New best: " + game.last + "!" : "You scored " + game.last}</h2><p>${game.newBest ? "Your score is on the board." : "Your best is " + game.best + ". Go again?"}</p><button class="btn pop" data-act="start-game">Play again</button>`
    : `<h2 class="cover-h">Dumpling Dash</h2><p>Tap dumplings as they pop up: +1.<br>Tap a chilli: −3. You have 20 seconds.</p><button class="btn pop" data-act="start-game">Start</button>`;
  return `<section class="panel game">
    <div class="hud"><div><small>Score</small><span id="g-score">${game.score}</span></div><div style="text-align:right"><small>Your best</small><span>${game.best}</span></div></div>
    <div class="tbar"><i id="g-bar"></i></div>
    <div class="board-wrap"><div class="board" id="board">${Array.from({ length: 9 }, (_, i) => `<button class="basket" data-cell="${i}" aria-label="Steamer ${i + 1}"><i></i></button>`).join("")}</div>
      <div class="board-cover" id="g-cover"><div>${cover}</div></div>
    </div>
  </section>
  <section class="panel">
    <h2>Leaderboard</h2>
    <div class="modes" role="group" aria-label="Leaderboard">
      <button class="${ui.lbMode === "me" ? "on" : ""}" data-act="lb" data-mode="me">Just me</button>
      <button class="${ui.lbMode === "table" ? "on" : ""}" data-act="lb" data-mode="table">Table ${view.table}</button>
      <button class="${ui.lbMode === "all" ? "on" : ""}" data-act="lb" data-mode="all">Restaurant</button>
    </div>
    ${lb}
  </section>`;
}
function startGame() {
  game.score = 0; game.left = 20; game.newBest = false; game.counting = true;
  const s = $("#g-score"); if (s) s.textContent = "0";
  const bar = $("#g-bar"); if (bar) { bar.style.transition = "none"; bar.style.width = "100%"; }
  const cover = $("#g-cover"); let c = 3;
  cover.innerHTML = `<div class="count">${c}</div>`;
  const cd = setInterval(() => { c--; if (c > 0) cover.innerHTML = `<div class="count">${c}</div>`; else { clearInterval(cd); cover.remove(); game.counting = false; run(); } }, 650);
  game.timers.push(cd);
}
function run() {
  game.running = true;
  const cells = [...$("#board").children], bar = $("#g-bar");
  requestAnimationFrame(() => { bar.style.transition = "width 20s linear"; bar.style.width = "0%"; });
  game.timers.push(setInterval(() => { game.left--; if (game.left <= 0) endGame(); }, 1000));
  const spawn = () => {
    if (!game.running) return;
    const free = cells.filter(c => !c.classList.contains("up") && !c.classList.contains("hit"));
    if (free.length) {
      const c = free[Math.floor(Math.random() * free.length)], chili = Math.random() < .2;
      c.className = "basket up" + (chili ? " chili" : ""); c.dataset.kind = chili ? "chili" : "dumpling";
      game.timers.push(setTimeout(() => { if (c.classList.contains("up")) c.className = "basket"; }, Math.max(520, 1000 - (20 - game.left) * 22)));
    }
    game.timers.push(setTimeout(spawn, Math.max(300, 700 - (20 - game.left) * 18)));
  };
  spawn();
}
function hitCell(c) {
  if (!game.running || !c.classList.contains("up")) return;
  const chili = c.dataset.kind === "chili"; game.score = Math.max(0, game.score + (chili ? -3 : 1));
  c.className = "basket hit" + (chili ? " chili" : "");
  const f = document.createElement("b"); f.className = "plus" + (chili ? " minus" : ""); f.textContent = chili ? "−3" : "+1"; c.appendChild(f);
  setTimeout(() => { f.remove(); if (c.classList.contains("hit")) c.className = "basket"; }, 450);
  const s = $("#g-score"); if (s) s.textContent = game.score;
  if (navigator.vibrate) try { navigator.vibrate(chili ? 60 : 8); } catch {}
}
function stopGame() { game.running = false; game.counting = false; game.timers.forEach(t => { clearInterval(t); clearTimeout(t); }); game.timers = []; }
async function endGame() {
  stopGame(); game.last = game.score; LS.set("rt-last", game.last);
  const prev = S.scores[me.id];
  game.newBest = game.score > game.best;
  if (game.newBest) { game.best = game.score; LS.set("rt-best", game.best); }
  render(); if (game.newBest) confetti();
  const best = Math.max(game.score, prev && prev.table === view.table ? prev.best : 0);
  if (!prev || best !== prev.best || prev.table !== view.table || prev.name !== me.name) await put("scores", me.id, { name: me.name, table: view.table, best, at: Date.now() });
}

/* ================= Offers ================= */
const DEFAULT_OFFERS = [
  { id: "happy", title: "Happy hour: 20% off drinks", kind: "percent", value: 20, scope: "drinks", from: 16, to: 19, active: true },
  { id: "big", title: "₹150 off bills over ₹2,000", kind: "flat", value: 150, scope: "all", minBill: 2000, active: true },
  { id: "welcome", title: "10% off with code WELCOME10", kind: "percent", value: 10, scope: "all", code: "WELCOME10", active: true },
];
let OFFERS = DEFAULT_OFFERS;
const catOf = o => (DISH[o.dish] && DISH[o.dish].cat) || o.cat || "mains";
const hasWindow = of => of.from != null && of.to != null && of.from !== "" && of.to !== "" && +of.from !== +of.to;
const hourIn = (of, t) => { if (!hasWindow(of)) return true; const h = new Date(t).getHours(), f = +of.from, to = +of.to; return f < to ? h >= f && h < to : h >= f || h < to; };
const hh = h => { h = +h; const a = h % 12 || 12; return a + (h < 12 ? " am" : " pm"); };
function offerAmount(of, os, sub) {
  if (!of.active || (of.minBill && sub < of.minBill)) return 0;
  const elig = os.filter(o => (of.scope === "all" || catOf(o) === of.scope) && hourIn(of, o.at)).reduce((s, o) => s + lineTotal(o), 0);
  if (!elig) return 0;
  return Math.min(elig, of.kind === "percent" ? Math.round(elig * of.value / 100) : of.value);
}
function bestOffer(os, sub, code) {
  let best = null;
  OFFERS.forEach(of => {
    if (of.code && (!code || of.code.toUpperCase() !== String(code).toUpperCase())) return;
    const a = offerAmount(of, os, sub);
    if (a > 0 && (!best || a > best.amount)) best = { ...of, amount: a };
  });
  return best;
}
const offerWhen = of => [hasWindow(of) ? `${hh(of.from)}–${hh(of.to)}` : "", of.scope !== "all" ? ((CATS.find(c => c.id === of.scope) || {}).label || "") : "", of.minBill && !String(of.title).includes(fmt(of.minBill)) ? `bills over ${fmt(of.minBill)}` : "", of.code ? `use code ${of.code}` : ""].filter(Boolean).join(" · ");
const liveOffers = () => OFFERS.filter(of => of.active && hourIn(of, Date.now()));
const dealFor = cat => liveOffers().find(of => !of.code && !of.minBill && of.kind === "percent" && (of.scope === cat || of.scope === "all"));
function offersStrip() {
  const live = liveOffers(); if (!live.length) return "";
  return `<section class="offers"><h2 class="sec">Today's offers</h2><div class="offer-row" tabindex="0" role="region" aria-label="Today's offers">${live.map(of => `<div class="offer">${ICON.tag}<div><b>${esc(of.title)}</b><small>${esc(offerWhen(of) || "Applied automatically")}</small></div></div>`).join("")}</div></section>`;
}

}

async function sendToKitchen(n) {
  let items = 0;
  for (const o of ordersFor(n).filter(o => o.state === "new")) { const { id: oid, ...rest } = o; if (!await put("orders", oid, { ...rest, state: "cooking", cookAt: Date.now(), confirmedBy: staffName() })) return; items += o.qty; }
  if (items) logEvent("kitchen", n, `${staffName()} sent ${items} ${items === 1 ? "item" : "items"} from table ${n} to the kitchen`, { items });
  toast("Table " + n + " sent to the kitchen");
}

function fly(from, src) {
  if (!from || !src || calm()) return;
  const target = document.querySelector(".basketbar .bb-c") || document.querySelector('.nav [data-tab="table"]'); if (!target) return;
  const to = target.getBoundingClientRect(), img = document.createElement("img"); img.src = src; img.className = "flyer"; img.alt = "";
  Object.assign(img.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" }); document.body.appendChild(img);
  const dx = to.left + to.width / 2 - (from.left + from.width / 2), dy = to.top + to.height / 2 - (from.top + from.height / 2);
  img.animate([{ transform: "translate(0,0) scale(1) rotate(0deg)", opacity: 1 }, { transform: `translate(${dx * .5}px, ${dy * .35 - 60}px) scale(.55) rotate(-12deg)`, opacity: 1, offset: .45 }, { transform: `translate(${dx}px, ${dy}px) scale(.1) rotate(20deg)`, opacity: .4 }], { duration: 700, easing: "cubic-bezier(.45,0,.3,1)" }).onfinish = () => { img.remove(); const bb = document.querySelector(".basketbar"); if (bb) { bb.classList.remove("bump"); void bb.offsetWidth; bb.classList.add("bump"); } };
}
function confetti(n = 70) {
  if (calm()) return;
  const colors = ["#d63b2f", "#ffb703", "#13845a", "#ff8a5b", "#3a6ad6", "#f4c7c3"], cx = innerWidth / 2, cy = innerHeight * .38;
  for (let i = 0; i < n; i++) {
    const p = document.createElement("i"); p.className = "confetto"; p.style.background = colors[i % colors.length];
    p.style.left = cx + "px"; p.style.top = cy + "px"; if (i % 3 === 0) p.style.borderRadius = "50%"; if (i % 4 === 0) { p.style.width = "6px"; p.style.height = "14px"; }
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 240, dx = Math.cos(a) * v, dy = Math.sin(a) * v - 180;
    p.animate([{ transform: "translate(0,0) rotate(0deg)", opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .55 }, { transform: `translate(${dx * 1.15}px, ${dy + 460}px) rotate(${Math.random() * 1080}deg)`, opacity: 0 }], { duration: 1300 + Math.random() * 700, easing: "cubic-bezier(.2,.65,.4,1)" }).onfinish = () => p.remove();
  }
}
/* ================= Cloud backend (Supabase) for the standalone website ================= */
const CLOUD = window.RESTAURANT_BACKEND && window.supabase && window.supabase.createClient ? window.RESTAURANT_BACKEND : null;
const DOCS = "restaurant_docs";
let sb = null, cloudUser = null, cloudLive = false;
async function startCloud() {
  mode = "cloud";
  sb = window.supabase.createClient(CLOUD.url, CLOUD.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "olive-ember-auth" } });
  const { data: sess } = await sb.auth.getSession();
  cloudUser = sess && sess.session ? sess.session.user : null;
  if (cloudUser) { const { data } = await sb.rpc("restaurant_is_staff"); canEdit = data === true; }
  roleKnown = true;
  render();
  await cloudLoad();
  sb.channel("restaurant-live")
    .on("postgres_changes", { event: "*", schema: "public", table: DOCS }, p => {
      if (p.eventType === "DELETE") { const o = p.old || {}; if (o.coll && S[o.coll] && o.id in S[o.coll]) { const n = { ...S[o.coll] }; delete n[o.id]; S[o.coll] = n; } }
      else { const r = p.new; if (r && S[r.coll]) S[r.coll] = { ...S[r.coll], [r.id]: r.data }; }
      dataChanged();
    })
    .subscribe(status => { cloudLive = status === "SUBSCRIBED"; if (cloudLive) cloudLoad(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cloudLoad(); });
  /* safety net: networks that block live connections still stay in sync */
  setInterval(() => { if (!cloudLive && !document.hidden) cloudLoad(); }, 5000);
}
let cloudLoading = null;
async function cloudLoad() {
  if (cloudLoading) return cloudLoading;
  cloudLoading = (async () => {
    const next = Object.fromEntries(COLLS.map(c => [c, {}])), page = 1000;
    for (let from = 0; ; from += page) {
      const { data, error } = await sb.from(DOCS).select("coll,id,data").range(from, from + page - 1);
      if (error) { console.error(error); toast("Can't reach the restaurant right now. Check your connection."); return; }
      data.forEach(r => { if (next[r.coll]) next[r.coll][r.id] = r.data; });
      if (data.length < page) break;
    }
    COLLS.forEach(c => S[c] = next[c]); loadedRemote = true; dataChanged();
  })();
  try { await cloudLoading; } finally { cloudLoading = null; }
}
function cloudError(error) {
  console.error(error);
  const denied = error && (error.code === "42501" || /row-level security|permission/i.test(error.message || ""));
  toast(denied ? "That needs a staff sign-in." : "That didn't save. Check your connection and try again.");
  cloudLoad();
  return false;
}
async function cloudPut(coll, id, data) {
  S[coll] = { ...S[coll], [id]: data }; dataChanged();
  const q = coll === "feedback" ? sb.from(DOCS).insert({ coll, id, data }) : sb.from(DOCS).upsert({ coll, id, data }, { onConflict: "coll,id" });
  const { error } = await q;
  return error ? cloudError(error) : true;
}
async function cloudDel(coll, id) {
  const n = { ...S[coll] }; delete n[id]; S[coll] = n; dataChanged();
  const { error } = await sb.from(DOCS).delete().match({ coll, id });
  return error ? cloudError(error) : true;
}

function staffLoginsHTML() {
  if (mode !== "cloud") return "";
  if (!ui.staffList) { if (!ui.staffListLoading) loadStaffList(); return `<section class="panel form"><h2>Staff logins</h2><p class="muted" style="margin:0">Loading…</p></section>`; }
  const mine = (cloudUser && cloudUser.email || "").toLowerCase();
  return `<section class="panel form"><h2>Staff logins</h2>
    <p class="muted" style="margin:0">People on this list can open the staff floor and admin after signing in.</p>
    <ul class="mlist">${ui.staffList.map(s => `<li><span class="n"><b>${esc(s.email)}</b><small>${s.email === mine ? "You" : "Added " + new Date(s.added_at).toLocaleDateString()}</small></span>${s.email === mine ? "" : `<button class="btn sm ghost" data-act="sl-del" data-email="${esc(s.email)}">${ui.slArm === s.email ? "Tap again to remove" : "Remove"}</button>`}</li>`).join("")}</ul>
    <div class="coupon"><input id="sl-email" type="email" placeholder="new.staff@email.com" autocomplete="off"><button class="btn sm" data-act="sl-add">Add</button></div>
    <p class="note" style="text-align:left;margin:0">Each person also needs an account: in Supabase, open Authentication → Users → Add user, enter their email and a password, and tick "Auto Confirm User". Then give them the password.</p>
    <button class="btn ghost" data-act="signout">Sign out of this device</button></section>`;
}
async function loadStaffList() {
  ui.staffListLoading = true;
  const { data, error } = await sb.from("restaurant_staff").select("email,added_at").order("added_at");
  ui.staffListLoading = false; ui.staffList = error ? [] : data; render();
}
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "login-form") {
    e.preventDefault(); const btn = f.querySelector("button"); btn.disabled = true; ui.loginErr = ""; ui.loginEmail = $("#lg-email").value.trim();
    const { error } = await sb.auth.signInWithPassword({ email: ui.loginEmail, password: $("#lg-pass").value });
    if (error) { ui.loginErr = /confirm/i.test(error.message) ? "This account isn't confirmed yet. Ask the owner to confirm it in Supabase." : "Wrong email or password."; btn.disabled = false; render(); const pw = $("#lg-pass"); if (pw) pw.focus(); return; }
    location.reload();
  }
  if (f.id === "claim-form") {
    e.preventDefault(); const btn = f.querySelector("button"); btn.disabled = true; ui.loginErr = "";
    const { data, error } = await sb.rpc("restaurant_claim_owner", { setup_code: $("#lg-code").value.trim().toUpperCase() });
    if (error || data !== true) { ui.loginErr = "That code isn't right, or this restaurant already has an owner."; btn.disabled = false; render(); return; }
    location.reload();
  }
});
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.dataset.act === "signout" && sb) { await sb.auth.signOut(); location.reload(); }
  if (el.dataset.act === "sl-add") {
    const v = ($("#sl-email") && $("#sl-email").value.trim().toLowerCase()) || "";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { toast("Enter a full email address"); return; }
    const { error } = await sb.from("restaurant_staff").insert({ email: v });
    if (error) { toast(/duplicate/i.test(error.message) ? "That email is already on the list" : "Couldn't add that email"); return; }
    toast(v + " can now sign in as staff"); loadStaffList();
  }
  if (el.dataset.act === "sl-del") {
    const v = el.dataset.email; if (ui.slArm !== v) { ui.slArm = v; render(); return; }
    ui.slArm = null; const { error } = await sb.from("restaurant_staff").delete().eq("email", v);
    toast(error ? "Couldn't remove that email" : v + " removed"); loadStaffList();
  }
});

/* ================= Boot ================= */
cacheLoad().finally(() => { D3.cacheReady = true; render(); });
setTimeout(() => { if (!D3.cacheReady) { D3.cacheReady = true; render(); } }, 1800);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in TENT) delete TENT[k]; if (view.name === "admin") render(); });
addEventListener("load", () => { if (view.name === "admin") render(); });
route();
(async () => {
  const c = window.claude;
  if (CLOUD) { try { await startCloud(); } catch (e) { console.error(e); roleKnown = true; startLocal(); } return; }
  if (!c || !c.use) { roleKnown = true; startLocal(); return; }
  const [d, user] = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null)]);
  let canWrite = null;
  if (user) { try { canWrite = await user.can("data.write"); } catch {} try { canEdit = !!(await user.canEdit()); } catch {} try { uid = await user.id(); } catch {} }
  if (d && canWrite !== false) { db = d; startRemote(); } else startLocal();
  downloads = await c.use("downloads").catch(() => null);
  roleKnown = true;
  if (canEdit) assets = await c.use("assets").catch(() => null);
  render();
})();
})();

</script>
